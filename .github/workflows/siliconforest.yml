name: SiliconForest CPU checks
"on":
  push:
    branches: [siliconforest/next]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check source inventory and production CPU tests
        run: python3 tools/siliconforest/check.py
